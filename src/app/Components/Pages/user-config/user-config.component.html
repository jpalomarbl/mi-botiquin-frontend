<div class="user-config">
  <h1>Datos personales</h1>
  <form class="loginForm" [formGroup]="userForm" (ngSubmit)="submitUserConfig()">
    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input
        type="text"
        [formControl]="firstName"
        matInput
        placeholder="Ana María"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Apellidos</mat-label>
      <input
        type="text"
        [formControl]="lastName"
        matInput
        placeholder="Gutierrez Palomares"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input
        type="password"
        [formControl]="password"
        matInput
        placeholder="*********"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirmar contraseña</mat-label>
      <input
        type="password"
        [formControl]="confirmPassword"
        matInput
        placeholder="*********"
      />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Rol</mat-label>
      <mat-select [formControl]="role">
        <mat-option value="patient">Paciente</mat-option>
        <mat-option value="caretaker">Cuidador(a)</mat-option>
        <mat-option value="family member">Familiar</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-button>Guardar</button>
  </form>
</div>
