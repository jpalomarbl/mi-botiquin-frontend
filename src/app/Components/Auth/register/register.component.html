<custom-header></custom-header>

<div class="registerContainer">
  <h1>Register</h1>
  <form class="registerForm" [formGroup]="registerForm" (ngSubmit)="submitRegister()">
    <mat-form-field appearance="fill">
      <mat-label>First name: </mat-label>
      <input type="text" [formControl]="firstName" matInput placeholder="John" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Last name: </mat-label>
      <input type="text" [formControl]="lastName" matInput placeholder="Doe" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email: </mat-label>
      <input type="text" [formControl]="email" matInput placeholder="email@email.com" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Password: </mat-label>
      <input type="password" [formControl]="password" matInput placeholder="*********" />
    </mat-form-field>

    <mat-form-field>
      <mat-label>Choose an option</mat-label>
      <mat-select [formControl]="role">
        <mat-option value="patient">Patient</mat-option>
        <!-- <mat-option value="caretaker">Caretaker</mat-option>
        <mat-option value="family member">Family member</mat-option> -->
      </mat-select>
    </mat-form-field>

    <button mat-button>Register</button>
  </form>

  <button mat-button (click)="submitRegisterGoogle()">Register with Google</button>
</div>
