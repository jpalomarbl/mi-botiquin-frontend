<div class="register">
  <form
    class="register-form"
    [formGroup]="registerForm"
    (ngSubmit)="submitRegister()"
  >
    <h1 class="register-form__title">Registro</h1>

    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input
        type="text"
        [formControl]="firstName"
        matInput
        placeholder="John"
      />

      <div
        class="form__errors"
        *ngIf="firstName.errors && firstName.dirty && firstName.touched"
      >
        <mat-error
          class="form__error-message"
          *ngIf="firstName.errors?.['required']"
          >Debes especificar un nombre.</mat-error
        >
      </div>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Apellidos</mat-label>
      <input type="text" [formControl]="lastName" matInput placeholder="Doe" />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Email</mat-label>
      <input
        type="text"
        [formControl]="email"
        matInput
        placeholder="email@email.com"
      />

      <div
        class="form__errors"
        *ngIf="email.errors && email.dirty && email.touched"
      >
        <mat-error
          class="form__error-message"
          *ngIf="email.errors?.['required']"
          >Debes especificar un email.</mat-error
        >

        <mat-error class="form__error-message" *ngIf="email.errors?.['email']"
          >El email no es válido.</mat-error
        >
      </div>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input
        type="password"
        [formControl]="password"
        matInput
        placeholder="*********"
      />

      <div
        class="form__errors"
        *ngIf="password.errors && password.dirty && password.touched"
      >
        <mat-error
          class="form__error-message"
          *ngIf="password.errors?.['required']"
          >Debes especificar una contraseña.</mat-error
        >
      </div>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Elige tu rol</mat-label>
      <mat-select [formControl]="role">
        <mat-option value="patient">Paciente</mat-option>
        <mat-option value="caretaker">Cuidador</mat-option>
        <mat-option value="family member">Familiar</mat-option>
      </mat-select>
    </mat-form-field>

    <button class="register-form__button" [disabled]="registerForm.invalid" mat-raised-button color="primary">
      Registro
    </button>

    <!-- Google OAuth Button -->
    <button class="gsi-material-button" (click)="submitRegisterGoogle()">
      <div class="gsi-material-button-state"></div>
      <div class="gsi-material-button-content-wrapper">
        <div class="gsi-material-button-icon">
          <svg
            version="1.1"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 48 48"
            xmlns:xlink="http://www.w3.org/1999/xlink"
            style="display: block"
          >
            <path
              fill="#EA4335"
              d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
            ></path>
            <path
              fill="#4285F4"
              d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
            ></path>
            <path
              fill="#FBBC05"
              d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
            ></path>
            <path
              fill="#34A853"
              d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
            ></path>
            <path fill="none" d="M0 0h48v48H0z"></path>
          </svg>
        </div>
        <span class="gsi-material-button-contents">Sign in with Google</span>
        <span style="display: none">Sign in with Google</span>
      </div>
    </button>
  </form>
</div>
