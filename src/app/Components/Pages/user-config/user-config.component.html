
<div class="user-config">
  <form
    class="user-config__form"
    [formGroup]="userForm"
    (ngSubmit)="submitUserConfig()"
  >
    <h1 class="user-config__title">Datos personales</h1>

    <mat-form-field appearance="fill">
      <mat-label>Nombre</mat-label>
      <input
        type="text"
        [formControl]="firstName"
        matInput
        placeholder="Ana María"
      />
      <div
        class="form__errors"
        *ngIf="firstName.errors && firstName.dirty && firstName.touched"
      >
        <mat-error
          class="form__error-message"
          *ngIf="firstName.errors?.['required']"
          >Debes tener al menos un nombre.
        </mat-error>
      </div>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Apellidos</mat-label>
      <input
        type="text"
        [formControl]="lastName"
        matInput
        placeholder="Gutierrez Palomares"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Contraseña</mat-label>
      <input
        type="password"
        [formControl]="password"
        matInput
        placeholder="*********"
      />
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirmar contraseña</mat-label>
      <input
        type="password"
        [formControl]="confirmPassword"
        matInput
        placeholder="*********"
      />
      <div
        class="form__errors"
        *ngIf="userForm.errors?.['passwordsMatch'] && (confirmPassword.dirty || confirmPassword.touched)"
      >
        <mat-error
          class="form__error-message"
          *ngIf="userForm.errors?.['passwordsMatch']"
          >Las contraseñas no coinciden.
        </mat-error>
      </div>
    </mat-form-field>

    <mat-form-field>
      <mat-label>Rol</mat-label>
      <mat-select [formControl]="role">
        <mat-option value="patient">Paciente</mat-option>
        <mat-option value="caretaker">Cuidador(a)</mat-option>
        <mat-option value="family member">Familiar</mat-option>
      </mat-select>
    </mat-form-field>

    <button mat-raised-button color="primary" [disabled]="userForm.invalid">Guardar</button>
  </form>

  <button mat-button color="warn" (click)="logout()">Cerrar sesión</button>
</div>
