<custom-header></custom-header>

<div class="add-medicine">
  <h2 class="add-medicine__title">
    {{ medicine.name }}
  </h2>

  <section class="buttons">
    <button mat-fab extended color="primary">
      <mat-icon>edit</mat-icon>
      Cambiar medicamento
    </button>
  </section>

  <section>
    <form
      class="medicine-form"
      [formGroup]="medicineForm"
      (ngSubmit)="submitForms()"
    >
      <mat-form-field
        class="medicine-form__field--expiration-date"
        appearance="fill"
      >
        <mat-label>Fecha de caducidad</mat-label>
        <input
          matInput
          [matDatepicker]="expirationDatePicker"
          [formControl]="expirationDate"
        />
        <mat-hint>DD/MM/AAAA</mat-hint>
        <mat-datepicker-toggle
          matIconSuffix
          [for]="expirationDatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker touchUi #expirationDatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field medicine-form__field--amount appearance="fill">
        <mat-label>Cantidad de reserva</mat-label>
        <input
          type="number"
          [formControl]="amountMedicine"
          matInput
          placeholder="1"
        />
      </mat-form-field>

      <mat-form-field medicine-form__field--medicine-unit appearance="fill">
        <mat-label>Unidad</mat-label>
        <mat-select [formControl]="unitMedicine">
          <mat-optgroup
            *ngFor="let formaFarmaceutica of medicineUnitsArray"
            [label]="formaFarmaceutica[0]"
          >
            <mat-option
              *ngFor="let medicineUnit of formaFarmaceutica[1]"
              [value]="medicineUnit"
            >
              {{ medicineUnit }}
            </mat-option>
          </mat-optgroup>
        </mat-select>
      </mat-form-field>
    </form>
  </section>

  <section>
    <h3 class="reminder-form__title">Recordatorio</h3>
    <form
      class="reminder-form"
      *ngIf="!addReminder"
      [formGroup]="reminderForm"
      (ngSubmit)="submitForms()"
    >
      <mat-form-field class="reminder-form--amount" appearance="fill">
        <mat-label>Tomar</mat-label>
        <input
          type="number"
          [formControl]="amountReminder"
          matInput
          placeholder="1"
        />
      </mat-form-field>

      <p class="reminder-form__medicine-unit">{{ medicine.unit }}</p>

      <mat-form-field class="reminder-form--frequency" appearance="fill">
        <mat-label>Cada</mat-label>
        <input
          type="number"
          [formControl]="frequency"
          matInput
          placeholder="1"
        />
      </mat-form-field>

      <mat-form-field>
        <mat-select
          [formControl]="frequencyUnit"
          [(value)]="reminder.frequencyUnit"
        >
          <mat-option value="minutos">Minutos</mat-option>
          <mat-option value="horas">Horas</mat-option>
          <mat-option value="días">Días</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field class="reminder-form--start-date" appearance="fill">
        <mat-label>Desde</mat-label>
        <input
          matInput
          [matDatepicker]="startDatePicker"
          [formControl]="startDate"
        />
        <mat-hint>DD/MM/AAAA</mat-hint>
        <mat-datepicker-toggle
          matIconSuffix
          [for]="startDatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker touchUi #startDatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="reminder-form--start-time" appearance="fill">
        <mat-label>A las</mat-label>
        <input matInput type="time" [formControl]="startTime" required />
      </mat-form-field>

      <mat-form-field class="reminder-form--finish-date" appearance="fill">
        <mat-label>Hasta</mat-label>
        <input
          matInput
          [matDatepicker]="finishDatePicker"
          [formControl]="finishDate"
        />
        <mat-hint>DD/MM/AAAA</mat-hint>
        <mat-datepicker-toggle
          matIconSuffix
          [for]="finishDatePicker"
        ></mat-datepicker-toggle>
        <mat-datepicker touchUi #finishDatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field class="reminder-form--finish-date" appearance="fill">
        <mat-label>A las</mat-label>
        <input matInput type="time" [formControl]="finishTime" required />
      </mat-form-field>
    </form>

    <button class="reminder-form__button" mat-raised-button color="primary">Añadir recordatorio</button>
  </section>

  <button class="submit-button" mat-raised-button color="primary">Añadir medicamento <span *ngIf="addReminder"> y recordatorio</span></button>
</div>

<custom-footer></custom-footer>
